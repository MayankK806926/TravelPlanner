name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The REST server pulls in Crow + Asio, so it is built on Linux
          # only - enough to keep server.cpp compiling, without paying the
          # cost twice.
          - os: ubuntu-latest
            build_server: 'ON'
          - os: windows-latest
            build_server: 'OFF'

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libsqlite3-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SERVER=${{ matrix.build_server }}

      - name: Build
        run: cmake --build build --config Release -j 2

      - name: Test
        working-directory: build
        run: ctest --output-on-failure -C Release

      # CMake degrades gracefully when a dependency is missing, which is good
      # for local builds but means a silently skipped target would otherwise
      # let CI pass green without ever compiling that code. Assert instead.
      # Asserted unconditionally rather than gated on matrix.build_server:
      # a check that reads the same variable it is meant to validate would
      # pass just as silently if that variable were ever wrong.
      - name: Verify expected binaries were built
        if: runner.os == 'Linux'
        run: |
          set -e
          test -x build/travel_planner \
            || { echo "::error::CLI binary missing - libcurl was probably not found"; exit 1; }
          test -x build/travel_planner_server \
            || { echo "::error::server binary missing - server.cpp was never compiled"; exit 1; }
          echo "CLI and server binaries both present"
